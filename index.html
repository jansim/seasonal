<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seasonal Produce Calendar</title>
<meta name="description" content="What's in season, month by month — an interactive seasonal fruit and vegetable calendar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 26a12 12 0 0 1 24 0' fill='none' stroke='%23D93A3A' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M10 26a6 6 0 0 1 12 0' fill='none' stroke='%237EAA2F' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Figtree:wght@400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="css/style.css">
<style id="page-style"></style>
<script type="module" src="js/app.js"></script>
</head>
<body data-view="timeline">

<div class="print-bar" id="print-bar" hidden>
  <div class="print-bar-inner">
    <strong class="print-bar-title">Print &amp; export</strong>
    <label class="select">
      <span class="sr-only">Paper size</span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>
      <select id="paper">
        <option value="a4">A4</option>
        <option value="a3">A3</option>
        <option value="letter">Letter</option>
      </select>
    </label>
    <div class="seg" role="group" aria-label="Orientation">
      <button type="button" data-orient="landscape">Landscape</button>
      <button type="button" data-orient="portrait">Portrait</button>
    </div>
    <label class="switch">
      <input type="checkbox" id="print-highlight">
      <span class="switch-track" aria-hidden="true"></span>
      <span>Highlight <span id="print-month-label"></span></span>
    </label>
    <label class="switch">
      <input type="checkbox" id="print-today">
      <span class="switch-track" aria-hidden="true"></span>
      Today marker
    </label>
    <span class="spacer"></span>
    <button type="button" class="btn" id="export-csv">CSV</button>
    <button type="button" class="btn arch-only" id="export-svg">SVG</button>
    <button type="button" class="btn primary" id="print-go">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-7a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v7h-3M7 14h10v7H7z"/></svg>
      Print / Save PDF
    </button>
    <button type="button" class="icon-btn" id="print-close" aria-label="Close print mode">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
</div>

<div class="app">
  <header class="masthead">
    <div class="eyebrow">SEASONAL PRODUCE CALENDAR</div>
    <h1>What’s in season in <em id="title-country">…</em></h1>
  </header>

  <section class="controls" aria-label="Calendar options">
    <label class="select">
      <span class="sr-only">Country</span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <select id="country"></select>
    </label>

    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="timeline">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h9M8 12h12M4 17h7"/></svg>Timeline
      </button>
      <button type="button" data-view="arch">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 19a9 9 0 0 1 18 0M8 19a4 4 0 0 1 8 0"/></svg>Arch
      </button>
    </div>

    <div class="seg" role="group" aria-label="Category" id="category"></div>

    <label class="search">
      <span class="sr-only">Search produce</span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input type="search" id="query" placeholder="Search produce" autocomplete="off">
    </label>

    <label class="select">
      <span class="sr-only">Sort</span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M17 20V4M13.5 7.5 17 4l3.5 3.5"/></svg>
      <select id="sort">
        <option value="season">By season</option>
        <option value="name">A–Z</option>
      </select>
    </label>

    <label class="switch">
      <input type="checkbox" id="stored" checked>
      <span class="switch-track" aria-hidden="true"></span>
      From storage
    </label>

    <button type="button" class="btn primary" id="print-btn">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-7a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v7h-3M7 14h10v7H7z"/></svg>
      Print / export
    </button>
  </section>

  <section class="now card" aria-label="In season this month">
    <div class="now-head">
      <button type="button" class="icon-btn" id="prev-month" aria-label="Previous month">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg>
      </button>
      <h2 id="now-month" aria-live="polite">—</h2>
      <button type="button" class="icon-btn" id="next-month" aria-label="Next month">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg>
      </button>
      <button type="button" class="btn small" id="today-btn" hidden>Back to today</button>
    </div>
    <div id="chips"></div>
  </section>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <main class="sheet card" id="sheet">
        <div class="sheet-head">
          <div>
            <div class="eyebrow" id="sheet-eyebrow"></div>
            <h2 class="sheet-title" id="sheet-title"></h2>
          </div>
          <div class="legend" aria-label="Legend">
            <span><i class="key fresh"></i>Fresh</span>
            <span id="legend-stored"><i class="key stored"></i>From storage</span>
          </div>
        </div>
        <div class="view" id="view" aria-live="polite"></div>
        <footer class="sheet-foot">
          <span id="note"></span>
          <span>Seasonal produce calendar</span>
        </footer>
      </main>
    </div>
  </div>

  <footer class="site-foot">
    <p>Seasons are approximate and vary by region and year. Data lives in plain JSON — add a country or fix a month in
      <a href="https://github.com/jansim/seasonal/tree/main/data">data/</a>.</p>
  </footer>
</div>

<div class="tooltip" id="tip" role="tooltip" hidden></div>
</body>
</html>
